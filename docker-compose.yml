services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: symfony_farm_php

    volumes:
      - ./:/var/www

    working_dir: /var/www

    depends_on:
      - database

  nginx:
    image: nginx:latest

    container_name: symfony_farm_nginx

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  database:
    image: postgres:16

    container_name: symfony_farm_db

    environment:
      POSTGRES_DB: farm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: